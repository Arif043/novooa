name: novooa-server

# Geteilter ML-Dienst für Coolify, einmal pro Server und vor den Kunden-Stacks deployen.
# Zieht das gehärtete Image aus GHCR; erzeugt aus docker-compose.server.yaml.
# Jede Runtime meldet sich mit ihrer Lizenz-ID an; Teammodelle bleiben je Runtime getrennt.
# Anleitung: docs/notes/coolify-deployment.md

services:
  novooa-ml:
    image: ghcr.io/arif043/novooa-ml:${NOVOOA_VERSION:-2026.10.31-0e3e108e}
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      # Globaler Modellspeicher: Website-Endpunkt des Garage-Buckets auf dem VPS (öffentlich lesbar) für Katalogmodelle.
      MODEL_STORE_URL: ${NOVOOA_MODEL_STORE_URL:-}
      MODEL_BUNDLE_MAX_BYTES: ${NOVOOA_ML_BUNDLE_MAX_BYTES:-}
      MODEL_TEAM_MAX_BYTES: ${NOVOOA_ML_TEAM_MAX_BYTES:-}
      MODEL_TENANT_SESSION_BYTES: ${NOVOOA_ML_TENANT_SESSION_BYTES:-}
      ML_MAX_TENANTS: ${NOVOOA_ML_MAX_TENANTS:-}
    expose:
      - "8081"
    networks:
      - novooa-ml
      - novooa-ml-egress
    volumes:
      - novooa-ml-data:/var/lib/novooa-ml
    # Rechenplätze und Speicherbudget leitet der Dienst aus diesen Grenzen ab; der Rest bleibt den Runtimes.
    cpus: ${NOVOOA_ML_CPUS:-2}
    mem_limit: ${NOVOOA_ML_MEMORY_LIMIT:-8g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 12

networks:
  # Intern: nur die Runtimes der Stacks erreichen den ML-Dienst, er selbst kommt darüber nicht ins Internet.
  novooa-ml:
    name: novooa-ml
    internal: true
  # Nur für den Download aus dem globalen Modellspeicher.
  novooa-ml-egress:

volumes:
  novooa-ml-data:
