name: novooa-local

services:
  runtime:
    build:
      context: .
      dockerfile: functions/Dockerfile.local-runtime
    environment:
      PORT: "8080"
      # Kalendertage in Bedingungen („ist am“) gelten in dieser Zeitzone.
      TZ: ${TZ:-Europe/Berlin}
      # Liefert die Web-App unter derselben Herkunft aus wie die API — damit
      # entfallen CORS und Mixed Content (siehe
      # docs/notes/runtime-liefert-web-app.md). Ohne Verzeichnis bleibt die
      # Runtime eine reine API.
      LOCAL_RUNTIME_WEB_DIRECTORY: /app/web
      # Erlaubte Browser-Herkünfte für CORS. Leer = keine fremde Herkunft.
      # Nur für lokale Entwicklung nötig (z.B. http://localhost:59193).
      LOCAL_RUNTIME_ALLOWED_ORIGINS: ${LOCAL_RUNTIME_ALLOWED_ORIGINS:-}
      NOVOOA_LOCAL_DEVELOPMENT: ${NOVOOA_LOCAL_DEVELOPMENT:-false}
      # Der ML-Dienst des Servers; die Runtime meldet sich dort mit ihrer Lizenz-ID an.
      PYTHON_INFERENCE_SIDECAR_URL: http://novooa-ml:8081
      # Optionale Obergrenze je hochgeladener Modelldatei in Bytes; leer = nur der freie Platz begrenzt.
      MODEL_ARTIFACT_MAX_BYTES: ${NOVOOA_MODEL_ARTIFACT_MAX_BYTES:-}
      # Script-Bausteine laufen in einem eigenen, abgeschotteten Container (siehe novooa-script).
      SCRIPT_RUNNER_URL: http://novooa-script:8091
      LOCAL_RUNTIME_MASTER_KEY_FILE: /var/lib/novooa-keys/runtime-master-key
      LOCAL_RUNTIME_LICENSE_GATEWAY_URL: ${LOCAL_RUNTIME_LICENSE_GATEWAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/issueLocalRuntimeLicense}
      LOCAL_RUNTIME_PUSH_RELAY_URL: ${LOCAL_RUNTIME_PUSH_RELAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimePushRelay}
      LOCAL_RUNTIME_TASK_BUILDER_RELAY_URL: ${LOCAL_RUNTIME_TASK_BUILDER_RELAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimeTaskBuilderRelay}
      LOCAL_RUNTIME_MAIL_RELAY_URL: ${LOCAL_RUNTIME_MAIL_RELAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimeMailRelay}
      # Skill-Katalog (skills.sh) über das Relay in Firebase: Die Runtime weist sich mit ihrer Lizenz aus, das Relay
      # prüft sie und ruft den Vercel-Proxy (relay/skills-sh-proxy) auf. Leer setzen (SKILLS_SH_RELAY_URL=) schaltet
      # den Katalog ab; Import per GitHub/ZIP/Ordner geht immer. SKILLS_SH_BASE_URL / SKILLS_SH_TOKEN sind nur für
      # den direkten Zugang in der Entwicklung (siehe docs/notes/skills-sh-katalog.md).
      SKILLS_SH_RELAY_URL: ${SKILLS_SH_RELAY_URL-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimeSkillsRelay}
      SKILLS_SH_BASE_URL: ${SKILLS_SH_BASE_URL:-}
      SKILLS_SH_TOKEN: ${SKILLS_SH_TOKEN:-}
      LOCAL_RUNTIME_FIREBASE_API_KEY: ${LOCAL_RUNTIME_FIREBASE_API_KEY:-AIzaSyCqT815piSitiqbdyIt_r5V57p0_95tGaI}
      LOCAL_RUNTIME_FIREBASE_PROJECT_ID: ${LOCAL_RUNTIME_FIREBASE_PROJECT_ID:-syscat-90bff}
      LOCAL_RUNTIME_FIREBASE_TOKEN_URL: ${LOCAL_RUNTIME_FIREBASE_TOKEN_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/issueLocalRuntimeFirebaseToken}
    depends_on:
      key-init:
        condition: service_completed_successfully
      novooa-script:
        condition: service_healthy
    ports:
      # Reguläre API auf allen Host-Schnittstellen, damit Clients im LAN die
      # private IPv4-Adresse des Hosts verwenden können. Der Verkehr ist dabei
      # unverschlüsselt — diesen Port niemals aus dem Internet erreichbar
      # machen; für externen Zugriff gehört ein eigener Reverse Proxy mit
      # Domain und Zertifikat davor (siehe docs/notes/reverse-proxy-externer-zugriff.md).
      # Mehrere Stacks auf einem Server brauchen je einen eigenen Port (NOVOOA_RUNTIME_PORT).
      - "${NOVOOA_RUNTIME_PORT:-8090}:8080"
    volumes:
      - novooa-data:/var/lib/novooa
      - novooa-keys:/var/lib/novooa-keys
      # Als Bind-Mount statt COPY ins Image: So lässt sich die Web-App mit
      # `flutter build web` neu bauen, ohne das Image anzufassen. Vor dem
      # ersten Start einmal ausführen — fehlt das Verzeichnis, liefert die
      # Runtime nur die API aus und antwortet auf App-Pfade mit 404.
      - ./build/web:/app/web:ro
    networks:
      - novooa-public
      - novooa-private
      - novooa-script
      - novooa-ml
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const response = await fetch('http://127.0.0.1:8080/healthz'); process.exit(response.ok ? 0 : 1)"]
      interval: 5s
      timeout: 2s
      retries: 12

  # Führt die Python-Scripts der Script-Bausteine aus. Abgeschottet: Das Netz
  # ist intern (kein Zugang nach außen, erreichbar nur von der Runtime), das
  # Dateisystem schreibgeschützt (nur /tmp, ohne Ausführung), kein Root, alle
  # Linux-Rechte abgegeben, Grenzen für Speicher, CPU und Prozesse. Pro Lauf
  # startet der Dienst einen frischen Prozess mit eigenem Arbeitsverzeichnis.
  novooa-script:
    build:
      context: .
      dockerfile: functions/Dockerfile.script-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8091"
      SCRIPT_MAX_PROCESSES: "64"
    expose:
      - "8091"
    networks:
      - novooa-script
    # Ein Init-Prozess als PID 1 sammelt beendete Kindprozesse ein. Sonst bleiben die
    # Nachkommen eines Scripts (fork) als Zombies stehen und füllen pids_limit.
    init: true
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Speicher und Prozessgrenze gehören zusammen: Ein leerer Python-Prozess belegt rund 8 MB, ein
    # Thread kaum etwas. 64 Prozesse brauchen so etwa 512 MB; dazu kommen ~64 MB für Server und Init
    # und Platz für die Daten der Scripts. Wer SCRIPT_MAX_PROCESSES anhebt, hebt mem_limit mit an
    # (Faustregel: 64 MB + Prozesse x 8 MB, plus gut ein Drittel Reserve) und pids_limit auf Prozesse + 32.
    mem_limit: 768m
    cpus: 1.0
    # 64 Prozesse/Threads für Scripts (SCRIPT_MAX_PROCESSES) plus 32 Reserve für Server, Init und Healthcheck.
    pids_limit: 96
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 12

  key-init:
    build:
      context: .
      dockerfile: functions/Dockerfile.local-runtime
    user: "0:0"
    network_mode: none
    # Erzeugt beim ersten Start den Schlüsselbund im Volume novooa-keys; danach rotiert ihn die Runtime selbst.
    command: [node, lib/shared/local/local-runtime-keyring-init-cli.js]
    environment:
      LOCAL_RUNTIME_MASTER_KEY_FILE: /var/lib/novooa-keys/runtime-master-key
    volumes:
      - novooa-keys:/var/lib/novooa-keys

  key-rotation:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: functions/Dockerfile.local-runtime
    user: "0:0"
    network_mode: none
    command: [node, lib/shared/local/local-runtime-key-rotation-cli.js]
    environment:
      LOCAL_RUNTIME_ROOT: /var/lib/novooa
      LOCAL_RUNTIME_MASTER_KEY_FILE: /var/lib/novooa-keys/runtime-master-key
    depends_on:
      key-init:
        condition: service_completed_successfully
    volumes:
      - novooa-data:/var/lib/novooa
      - novooa-keys:/var/lib/novooa-keys

  # Testumgebung für das Shopware-Plugin; nur mit `--profile dev`.
  shopware:
    profiles: [dev]
    image: dockware/play:latest
    container_name: shopware_app
    networks:
      - novooa-public
      - novooa-private
    ports:
      - "8000:80"     # Shopware Storefront & Admin
      - "8888:8888"   # Adminer (Datenbank-GUI)
      - "9999:9999"   # Mailcatcher (E-Mail-Testumgebung)

networks:
  novooa-public:
  novooa-private:
    internal: true
  novooa-script:
    internal: true
  # Zum ML-Dienst des Servers (docker-compose.server.yaml), den sich alle Stacks teilen.
  novooa-ml:
    external: true

volumes:
  novooa-data:
  novooa-keys:
