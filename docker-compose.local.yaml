name: novooa-local

services:
  runtime:
    build:
      context: .
      dockerfile: functions/Dockerfile.local-runtime
    environment:
      PORT: "8080"
      # Liefert die Web-App unter derselben Herkunft aus wie die API — damit
      # entfallen CORS und Mixed Content (siehe
      # docs/architecture/betriebsvarianten.md). Ohne Verzeichnis bleibt die
      # Runtime eine reine API.
      LOCAL_RUNTIME_WEB_DIRECTORY: /app/web
      # Erlaubte Browser-Herkünfte für CORS. Leer = keine fremde Herkunft.
      # Nur für lokale Entwicklung nötig (z.B. http://localhost:59193).
      LOCAL_RUNTIME_ALLOWED_ORIGINS: ${LOCAL_RUNTIME_ALLOWED_ORIGINS:-}
      NOVOOA_LOCAL_DEVELOPMENT: ${NOVOOA_LOCAL_DEVELOPMENT:-false}
      PYTHON_INFERENCE_SIDECAR_URL: http://novooa-ml:8081
      LOCAL_RUNTIME_MASTER_KEY_FILE: /var/lib/novooa-keys/runtime-master-key
      LOCAL_RUNTIME_LICENSE_PUBLIC_KEY_FILE: /run/secrets/novooa_runtime_license_public_key
      LOCAL_RUNTIME_LICENSE_GATEWAY_URL: ${LOCAL_RUNTIME_LICENSE_GATEWAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/issueLocalRuntimeLicense}
      LOCAL_RUNTIME_PUSH_RELAY_URL: ${LOCAL_RUNTIME_PUSH_RELAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimePushRelay}
      LOCAL_RUNTIME_TASK_BUILDER_RELAY_URL: ${LOCAL_RUNTIME_TASK_BUILDER_RELAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimeTaskBuilderRelay}
      LOCAL_RUNTIME_MAIL_RELAY_URL: ${LOCAL_RUNTIME_MAIL_RELAY_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimeMailRelay}
      # Skill-Katalog (skills.sh) über das Relay in Firebase: Die Runtime weist sich mit ihrer Lizenz aus, das Relay
      # prüft sie und ruft den Vercel-Proxy (relay/skills-sh-proxy) auf. Leer setzen (SKILLS_SH_RELAY_URL=) schaltet
      # den Katalog ab; Import per GitHub/ZIP/Ordner geht immer. SKILLS_SH_BASE_URL / SKILLS_SH_TOKEN sind nur für
      # den direkten Zugang in der Entwicklung (siehe docs/features/skills.md).
      SKILLS_SH_RELAY_URL: ${SKILLS_SH_RELAY_URL-https://europe-west3-syscat-90bff.cloudfunctions.net/localRuntimeSkillsRelay}
      SKILLS_SH_BASE_URL: ${SKILLS_SH_BASE_URL:-}
      SKILLS_SH_TOKEN: ${SKILLS_SH_TOKEN:-}
      LOCAL_RUNTIME_FIREBASE_API_KEY: ${LOCAL_RUNTIME_FIREBASE_API_KEY:-AIzaSyCqT815piSitiqbdyIt_r5V57p0_95tGaI}
      LOCAL_RUNTIME_FIREBASE_PROJECT_ID: ${LOCAL_RUNTIME_FIREBASE_PROJECT_ID:-syscat-90bff}
      LOCAL_RUNTIME_FIREBASE_TOKEN_URL: ${LOCAL_RUNTIME_FIREBASE_TOKEN_URL:-https://europe-west3-syscat-90bff.cloudfunctions.net/issueLocalRuntimeFirebaseToken}
    depends_on:
      key-init:
        condition: service_completed_successfully
      novooa-ml:
        condition: service_healthy
    ports:
      # Reguläre API auf allen Host-Schnittstellen, damit Clients im LAN die
      # private IPv4-Adresse des Hosts verwenden können. Der Verkehr ist dabei
      # unverschlüsselt — diesen Port niemals aus dem Internet erreichbar
      # machen; für externen Zugriff gehört ein eigener Reverse Proxy mit
      # Domain und Zertifikat davor (siehe docs/local-runtime.md).
      - "8090:8080"
    volumes:
      - novooa-data:/var/lib/novooa
      - novooa-keys:/var/lib/novooa-keys
      # Als Bind-Mount statt COPY ins Image: So lässt sich die Web-App mit
      # `flutter build web` neu bauen, ohne das Image anzufassen. Vor dem
      # ersten Start einmal ausführen — fehlt das Verzeichnis, liefert die
      # Runtime nur die API aus und antwortet auf App-Pfade mit 404.
      - ./build/web:/app/web:ro
    secrets:
      - novooa_runtime_license_public_key
    networks:
      - novooa-public
      - novooa-private
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const response = await fetch('http://127.0.0.1:8080/healthz'); process.exit(response.ok ? 0 : 1)"]
      interval: 5s
      timeout: 2s
      retries: 12
  novooa-ml:
    build:
      context: .
      dockerfile: functions/Dockerfile.model-inference-sidecar
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      MODEL_SESSION_CACHE_ENTRIES: "4"
    expose:
      - "8081"
    networks:
      - novooa-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 12

  key-init:
    build:
      context: .
      dockerfile: functions/Dockerfile.local-runtime
    user: "0:0"
    network_mode: none
    command: [node, lib/shared/local/local-runtime-keyring-seed-cli.js]
    environment:
      LOCAL_RUNTIME_MASTER_KEY_FILE: /var/lib/novooa-keys/runtime-master-key
      LOCAL_RUNTIME_MASTER_KEY_SEED_FILE: /run/secrets/novooa_runtime_master_key
    volumes:
      - novooa-keys:/var/lib/novooa-keys
    secrets:
      - novooa_runtime_master_key

  key-rotation:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: functions/Dockerfile.local-runtime
    user: "0:0"
    network_mode: none
    command: [node, lib/shared/local/local-runtime-key-rotation-cli.js]
    environment:
      LOCAL_RUNTIME_ROOT: /var/lib/novooa
      LOCAL_RUNTIME_MASTER_KEY_FILE: /var/lib/novooa-keys/runtime-master-key
    depends_on:
      key-init:
        condition: service_completed_successfully
    volumes:
      - novooa-data:/var/lib/novooa
      - novooa-keys:/var/lib/novooa-keys

networks:
  novooa-public:
  novooa-private:
    internal: true

volumes:
  novooa-data:
  novooa-keys:

secrets:
  novooa_runtime_master_key:
    file: ${NOVOOA_LOCAL_SECRETS_DIRECTORY:-.novooa}/runtime-master-key
  novooa_runtime_license_public_key:
    file: ${NOVOOA_LOCAL_SECRETS_DIRECTORY:-.novooa}/runtime-license-public-key
