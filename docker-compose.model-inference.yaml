services:
  gateway:
    build:
      context: .
      dockerfile: functions/Dockerfile.model-inference
    depends_on:
      inference-sidecar:
        condition: service_healthy
    environment:
      PORT: "8080"
      PYTHON_INFERENCE_SIDECAR_URL: http://inference-sidecar:8081
      MODEL_ARTIFACT_CACHE_ENTRIES: "4"
      MODEL_INFERENCE_MODE: local
      LOCAL_RUNTIME_ROOT: /var/lib/novooa
    ports:
      - 127.0.0.1:${MODEL_INFERENCE_PORT:-8080}:8080
    networks:
      - novooa-public
      - novooa-private
    volumes:
      - ${NOVOOA_RUNTIME_ROOT:-./.novooa}:/var/lib/novooa:ro
  inference-sidecar:
    build:
      context: .
      dockerfile: functions/Dockerfile.model-inference-sidecar
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      MODEL_SESSION_CACHE_ENTRIES: "4"
    expose:
      - "8081"
    networks:
      - novooa-private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 12
networks:
  novooa-public:
  novooa-private:
    internal: true
